[project]
name = "hardening-check"
version = "0.1.0"
description = "CLI tool to evaluate ELF binary security hardening properties"
requires-python = ">=3.11"
dependencies = [
    "pyelftools>=0.31",
    "rich>=13.0",
]

[project.scripts]
hardening-check = "hardening_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hardening_check"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
